# Publishes the site to Azure Static Web Apps on every push to main.
# Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN
# (Azure portal > Static Web App > Manage deployment token).
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-swa
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: /
          skip_app_build: true
          skip_api_build: true
